[project]
name = "audiotriage"
version = "0.1.0"
description = "Multi-agent pipeline to detect and explain Logic Pro audio incidents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "psutil>=6.0.0",
]

[project.scripts]
audiotriage = "audiotriage.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
  "types-psutil>=7.0.0.20250722",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
exclude = ["src/audiotriage.egg-info/"]
